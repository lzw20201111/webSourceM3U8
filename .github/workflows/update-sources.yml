name: Update Live Sources

# ========== 更新频率配置（cron 表达式，UTC 时间，北京时间 = UTC + 8）==========
# 常用频率参考：
#   每 1 小时：  '0 * * * *'
#   每 2 小时：  '0 */2 * * *'   ← 当前配置
#   每 4 小时：  '0 */4 * * *'
#   每 6 小时：  '0 */6 * * *'
#   每 12 小时： '0 */12 * * *'
#   每天 1 次：  '0 0 * * *'    ← UTC 0:00 = 北京时间 8:00
#   每天 2 次：  '0 0,12 * * *' ← UTC 0:00 + 12:00 = 北京时间 8:00 + 20:00
#
# 注意：GitHub Actions 定时任务在高峰期可能延迟 5~15 分钟，属正常现象
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送文件到仓库
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch live sources
        run: python fetch_sources.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add xinyi.m3u xinyi-m3u8.txt xinyi-meta.json
          git diff --staged --quiet || git commit -m "chore: auto update live sources [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
