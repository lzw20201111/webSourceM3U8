name: 信宜广播直链保活

# 该台播放地址与「活跃播放会话」绑定，需要一个持续运行的播放会话才长期可用。
# 本工作流每 3 小时触发一次，每次运行约 5.5 小时：
#   - 多个任务互相重叠 → m3u 中的直连地址始终有活跃会话支撑，基本无空窗
#   - 启动时把最新有效地址写入 xinyi_radio_local.m3u 并提交
on:
  schedule:
    - cron: "5 */3 * * *"      # UTC 每 3 小时的第 5 分钟（避开整点调度高峰）
  push:
    paths:
      - "scripts/keepalive.py"
      - ".github/workflows/xinyi-keepalive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Playwright 与 Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 维持播放会话并更新直链
        env:
          RUN_MINUTES: "330"
        run: python scripts/keepalive.py
