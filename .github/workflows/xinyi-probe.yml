name: xinyi-probe

# 临时验证：在 Actions（海外数据中心）抓取播放地址并保持会话，
# 用于测试该地址在国内是否可直接播放。
on:
  push:
    paths:
      - "probe/**"
      - ".github/workflows/xinyi-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xinyi-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Playwright 与 Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 抓取并保持会话
        run: python probe/keepalive.py
